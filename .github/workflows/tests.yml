name: Package tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            laravel: '^11.0'
            testbench: '^9.0'

          - php: '8.3'
            laravel: '^11.0'
            testbench: '^9.0'

          - php: '8.3'
            laravel: '^12.0'
            testbench: '^10.0'

          - php: '8.4'
            laravel: '^12.0'
            testbench: '^10.0'

          - php: '8.3'
            laravel: '^13.0'
            testbench: '^11.0'

          - php: '8.4'
            laravel: '^13.0'
            testbench: '^11.0'

    name: PHP ${{ matrix.php }} | Laravel ${{ matrix.laravel }} | Testbench ${{ matrix.testbench }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          extensions: pdo_sqlite, sqlite3

      - name: Validate composer.json
        run: composer validate --strict

      - name: Configure dependency versions
        run: |
          composer require --dev --no-update --no-interaction \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "illuminate/http:${{ matrix.laravel }}" \
            "illuminate/database:${{ matrix.laravel }}"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: composer test:lint

      - name: Run PHPStan
        run: composer test:types

      - name: Run PHPUnit
        run: composer test:unit
